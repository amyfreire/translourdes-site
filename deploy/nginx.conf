# /etc/nginx/sites-available/translourdes.com.br
# Depois: ln -s ../sites-available/translourdes.com.br /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d translourdes.com.br -d www.translourdes.com.br

server {
    listen 80;
    listen [::]:80;
    server_name translourdes.com.br www.translourdes.com.br;

    root /var/www/translourdes-site/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
